name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller mkiv-gui.spec

      - name: Package artifact
        run: |
          Compress-Archive -Path dist/MKIV_Academic_Graph/* -DestinationPath MKIV-Academic-Graph-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKIV-Academic-Graph-Windows
          path: MKIV-Academic-Graph-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller mkiv-gui.spec

      - name: Package artifact
        run: |
          cd dist
          # 注意: mkiv-gui.spec 仅在 Windows 下生成 COLLECT 目录，
          # Linux 产物为单文件可执行程序，故此处直接打包该文件。
          tar -czf ../MKIV-Academic-Graph-Linux.tar.gz MKIV_Academic_Graph

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKIV-Academic-Graph-Linux
          path: MKIV-Academic-Graph-Linux.tar.gz

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MKIV-Academic-Graph-Windows/MKIV-Academic-Graph-Windows.zip
            MKIV-Academic-Graph-Linux/MKIV-Academic-Graph-Linux.tar.gz
          body: |
            ## MKIV Academic Intelligence Graph Engine ${{ github.ref_name }}

            ### 系统要求
            - **Windows**: Windows 10+ (64-bit)
            - **Linux**: Ubuntu 20.04+ 或兼容发行版
            - **Docker Desktop**: 一键部署 Neo4j 时需要
            - **内存**: 建议 8GB+ (NLP 流水线需要 16GB+)

            ### 安装说明
            1. 下载对应平台的压缩包
            2. 解压到任意目录
            3. **Windows**: 双击 `MKIV_Academic_Graph.exe`
            4. **Linux**: 终端运行 `./MKIV_Academic_Graph`

            ### 快速开始
            1. 首次运行会弹出设置向导
            2. 在左侧面板填写目标机构 ID 和邮箱
            3. 点击「一键部署 Neo4j」或连接已有数据库
            4. 选择运行模式，点击「开始执行」

            > 更多帮助请查看项目 README。
          draft: true
          prerelease: false
