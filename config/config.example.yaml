# ================================================================
# MKIV 学术情报图谱引擎 — 配置文件模板
# ================================================================
# 首次运行时会自动复制此文件为 config/config.yaml。
# 请编辑 config/config.yaml 填入你的实际参数。
# config/config.yaml 不会被上传到 Git (已在 .gitignore 中)。


# === 机构设置 ===
institution:
  email: "youremail@example.com"           # 你的邮箱 (OpenAlex Polite Pool 需要)
  start_year: 2021                          # 文献抓取起始年份
  end_year: null                             # 抓取结束年份 (null=当前年份)
  target_id: "https://openalex.org/IXXXXXXX"  # 目标机构 OpenAlex ID (请替换为你的机构)
  fallback_keywords:                        # 机构名兜底关键词 (正则匹配)
    - "university"                          # 示例: 机构英文关键词
    - "institute"
  golden_keys:                              # 金钥匙兜底映射 (关键字 → 标准名, 不区分大小写)
    # "example-lab": "示例重点实验室"           # 示例: 关键字(不区分大小写) → 标准名称

# === 数据路径 ===
paths:
  # 中间件输出
  data_u1_raw: "./data/01_raw/U1.json"
  data_u1_5_tagged: "./data/02_analyzed/U1.5.json"
  data_u2_cleaned: "./data/03_cleaned/U2.json"
  data_u2_unique: "./data/03_cleaned/unique.json"
  data_u2_5_nlp: "./data/03_cleaned/U2_5.json"
  data_u3_final: "./data/output/U3.json"

  # 输入文件
  input_author_excel: "./data/input/0_原始导师名单.xlsx"

  # 输出文件
  output_author_excel: "./data/output/0_作者匹配画像表.xlsx"

  # 人工校验映射表
  excel_aff_mapping: "./data/input/1_机构映射表.xlsx"
  excel_con_mapping: "./data/input/2_研究领域映射表.xlsx"

  # AI 预填版映射表
  excel_aff_mapping_ai: "./data/input/1_机构映射表_AI预填版.xlsx"
  excel_con_mapping_ai: "./data/input/2_研究领域映射表_AI预填版.xlsx"

  # 姓名转换
  input_names_excel: "./data/input/0_原始导师名单.xlsx"
  output_names_excel: "./data/output/0_作者匹配画像表.xlsx"

  # 情报分析输出
  data_concept_map: "./data/output/concept_dim_map.json"
  data_trends: "./data/output/trends.json"
  data_lab_radar: "./data/output/lab_radar.json"
  data_topic_sunburst: "./data/output/topic_sunburst.json"


# === NLP 参数 ===
nlp:
  target_aff_clusters: 30                   # 机构名聚类目标簇数 (建议设为实验室数量的 3~5 倍)
  model_name: "paraphrase-multilingual-MiniLM-L12-v2"  # SBERT 语义模型
  score_threshold: 0.4                      # 领域置信度阈值 (score > 该值才保留)
  level_threshold: 1                        # 学科层级阈值 (level <= 该值视为大类)
  min_aff_len: 5                            # 机构字符串最小长度 (过滤短噪音)
  kmeans_switch_threshold: 3000             # 机构变体超过此数量时改用 KMeans
  random_state: 42                          # 聚类随机种子 (可复现)
  cluster_metric: "euclidean"               # 聚类距离度量
  cluster_linkage: "ward"                   # 层次聚类链接方式
  reference_max_len: 60                     # 辅助参考名截断长度
  vanguard_strategy: "shortest"             # 排头兵选择策略: shortest | longest


# === LLM 大模型辅助 (可选) ===
llm_assistant:
  enabled: false                             # 是否启用
  api_url: "http://localhost:8080/v1/chat/completions"   # OpenAI 兼容 API
  concept_target_fields: "人工智能, 计算机视觉, 机器人学, 自动控制, 脑科学与神经科学, 医学影像, 计算机体系结构, 物理与工程, 生物与医学, 社会与人文, 数学与基础科学"
  affiliation_system_prompt: "你是一个机构识别专家。判断输入是否属于目标机构。如果是,输出其中文实验室/院系简称;如果不是,输出'外部合作机构'。只输出名称,不要解释。"
  temperature: 0                             # 采样温度 (0=确定性)
  max_tokens: 120                            # 单次返回最大 token
  request_timeout: 30                        # LLM 请求超时 (秒)
  batch_size: 80                             # 批量映射每批数量
  similarity_threshold: 0.85                 # 相似标准名自动合并阈值
  concept_prompt: "你是一个学术分类专家。请将输入的学科词汇归类到以下列表中的一个：[{target_fields}]。只输出分类名称，严禁任何解释。"
  concept_naming_prompt: "以下研究概念属于同一个主题簇:\n{sample}\n\n请为这个主题簇命名一个 2-6 字的中文名称..."


# === 作者画像匹配 ===
author_matcher:
  name_column: "导师姓名"                    # 输入 Excel 中姓名所在列
  neo4j_import_dir: "./data/import"          # Neo4j LOAD CSV 导入目录


# === 图数据库 (Neo4j) ===
database:
  uri: "bolt://localhost:7688"              # Bolt 连接地址
  user: "neo4j"                              # 用户名
  password: "请修改此密码"                    # ⚠️ 务必修改!
  connection_timeout: 10                     # 连接/获取超时 (秒)


# === 情报分析 ===
analytics:
  concept_clusters: 25                       # 概念降维目标簇数
  use_llm_labels: false                      # 是否用 LLM 命名概念簇


# === 爬虫 (OpenAlex) ===
crawler:
  api_url: "https://api.openalex.org/works"  # OpenAlex API 地址
  per_page: 200                              # 每页条数
  request_timeout: 30                        # 请求超时 (秒)
  rate_limit_sleep: 0.15                     # 每页间隔 (秒, 限速)
  cache_min_bytes: 1024                      # 本地缓存有效性最小字节数
  retry_total: 5                             # 重试次数
  retry_backoff: 1                           # 重试退避因子
  retry_status_codes: [429, 500, 502, 503, 504]  # 需要重试的状态码


# === 数据清洗 ===
cleaning:
  stop_words:                                # 机构名清洗停用词 (会从机构串中剔除)
    - "People's Republic of China"
    - "P. R. China"
    - "P.R. China"
    - "PRC"
    - "China"
    - "Beijing"


# === 分类/兜底标签 ===
labels:
  external: "外部合作机构"                    # 外部作者统一标签
  unknown_dept: "(未知部门)"                  # 无法识别部门兜底
  other_dept: "(其他部门)"                    # 未映射部门兜底
  other_unit: "其他单元"                      # 无机构信息兜底
  mentor_role: "导师"                         # 导师角色标签
  staff_role: "研究员/学生"                   # 非导师角色标签


# === 图可视化 (中心度/图规模) ===
graph:
  min_weight: 1                              # 合作边最小权重 (低于此值不显示)
  max_edges_default: 3000                    # 默认视图最大边数
  max_edges_filtered: 5000                   # 过滤视图最大边数
  mentor_symbol_size: 32                     # 导师节点大小
  staff_symbol_size: 12                      # 其他学者节点大小
  shorten_max_len: 16                        # 类别名截断长度
  echarts_cdn: "https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"
